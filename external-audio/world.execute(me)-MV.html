/* ============ 工具函数 ============ */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, k){ return a + (b - a) * k; }
function smooth(k){ k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function easeOut(k){ k = clamp(k, 0, 1); return 1 - Math.pow(1 - k, 3); }
function fract(x){ return x - Math.floor(x); }
function hash(n){ const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rgb(c, a){ const m = String(c).match(/\d+/g); return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + a + ')'; }
function fitFont(size){ return 'bold ' + size + 'px Consolas,"Cascadia Mono","Microsoft YaHei",monospace'; }
function softFont(size){ return '600 ' + size + 'px "Segoe UI","Microsoft YaHei",sans-serif'; }

const glowCache = new Map();
function glowSprite(color){
  let c = glowCache.get(color);
  if(c) return c;
  c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const m = String(color).match(/\d+/g);
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0, rgb(color, 0.85));
  grad.addColorStop(0.35, rgb(color, 0.32));
  grad.addColorStop(1, rgb(color, 0));
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  glowCache.set(color, c);
  return c;
}
function drawGlow(x, y, r, color, alpha, comp){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = comp || 'lighter';
  const s = glowSprite(color);
  const d = Math.max(2, r * 2);
  ctx.drawImage(s, x - d/2, y - d/2, d, d);
  ctx.restore();
}

const emojiCache = new Map();
function emojiSprite(ch, size){
  const key = ch + '|' + size;

  if(c) return c;
  c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * 2.2);

  g.font = size + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

}

const textCache = new Map();
function textSprite(text, font, color, glowColor){
  const key = text + '|' + font + '|' + color + '|' + (glowColor || '');

  if(c) return c;

  const g = c.getContext('2d');

  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  if(glowColor){ g.shadowColor = glowColor; g.shadowBlur = 16; }
  g.fillStyle = color;
  g.fillText(text, c.width/2, c.height/2);
  textCache.set(key, c);
  return c;
}

function drawTextSprite(sprite, cx, cy, h, alpha, rot){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  if(rot) ctx.rotate(rot);
  const scale = h / sprite.height;
  ctx.drawImage(sprite, -sprite.width * scale / 2, -h / 2, sprite.width * scale, h);
  ctx.restore();
}

function pathRoundRect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

const SPHERE = [];
(function(){
  const N = 240, ga = Math.PI * (3 - Math.sqrt(5));
  for(let i = 0; i < N; i++){
    const y = 1 - 2 * (i + 0.5) / N;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = ga * i;
    SPHERE.push({x: Math.cos(th) * r, y: y, z: Math.sin(th) * r});
  }
})();

function heartPoint(th){
  const x = 16 * Math.pow(Math.sin(th), 3);
  const y = 13 * Math.cos(th) - 5 * Math.cos(2*th) - 2 * Math.cos(3*th) - Math.cos(4*th);
  return {x: x / 17, y: -y / 16};
}

/* ========== 歌词解析 ========== */
const LYRICS = (function(){
  const out = [];
  const lines = LYRICS_RAW.split(/\r?\n/);
  for(const line of lines){
    if(!line || line[0] === '{') continue;
    const text = line.replace(/\[[^\]]*\]/g, '').trim();
    if(!text) continue;
    const re = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
    let m;
    while((m = re.exec(line))){
      out.push({t: parseInt(m[1],10) * 60 + parseFloat(m[2]), text: text});
    }
  }
  out.sort((a,b) => a.t - b.t);
  return out;
})();

function lyricIndexAt(t){
  let idx = -1;
  for(let i = 0; i < LYRICS.length; i++){
    if(t >= LYRICS[i].t - 0.05) idx = i; else break;
  }
  return idx;
}

function drawCodeLine(text, x, y, size, alpha, chars){
  ctx.font = fitFont(size);
  ctx.textBaseline = 'middle';
  const parts = String(text).split(/(\b[A-Z]{2,}\b)/g);
  let cx = x;
  const shown = text.substr(0, Math.max(0, Math.ceil(chars)));
  for(const part of parts){
    if(!part) continue;
    let end = cx - x + part.length;
    let drawLen = Math.max(0, Math.min(part.length, shown.length - (cx - x)));
    if(drawLen <= 0) break;
    const piece = part.substr(0, drawLen);
    ctx.fillStyle = (part.length > 2 && part === part.toUpperCase() && /[A-Z]/.test(part)) ? rgb('rgb(120,240,255)', alpha) : rgb('rgb(98,230,160)', alpha);
    ctx.fillText(piece, cx, y);
    cx += ctx.measureText(piece).width;
    if(end >= shown.length) break;
  }
  return cx;
}

/* =========================================================
   SCENE 7 · 01:43.49 - 02:05.70  碎裂 / 孤立
========================================================= */
function pathHeartShape(S, jitter, cx, cy){
  ctx.beginPath();
  for(let i = 0; i < HEART_PTS.length; i++){
    const p = HEART_PTS[i];
    const jx = (hash(i*1.7)-0.5)*jitter, jy = (hash(i*3.1)-0.5)*jitter;
    const x = cx + (p.x*S + jx), y = cy + (p.y*S + jy);
    if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function renderShatter(t, a){
  ctx.save();
  bg('#02030d', a);
  const cx = W/2, cy = H/2, S = Math.min(W,H)*0.40;
  const vib = smooth(clamp(t/5.5,0,1));
  const jitter = S*(0.006 + vib*0.030)*Math.sin(t*47);
  const breakT = 13.78;
  /* 背景星尘 */
  for(let i = 0; i < 55; i++){
    const x = hash(i*5.9)*W, y = hash(i*8.7)*H;
    ctx.fillStyle = rgb('rgb(130,150,255)', a*0.16);
    ctx.fillRect(x, y, 2, 2);
  }
  if(t < breakT){
    /* 完整的心 */
    drawGlow(cx, cy, S*0.95, 'rgb(255,80,160)', a*(0.16 + vib*0.12));
    ctx.fillStyle = rgb('rgb(255,70,150)', a*0.30);
    pathHeartShape(S, jitter, cx, cy); ctx.fill();
    ctx.strokeStyle = rgb('rgb(255,140,200)', a*0.85); ctx.lineWidth = 2.5;
    pathHeartShape(S, jitter, cx, cy); ctx.stroke();
    /* completion 闪光 */
    const comp = smooth(clamp((t-3.7)/0.8,0,1)) * smooth(clamp((5.6-t)/0.8,0,1));
    if(comp > 0.01) drawGlow(cx, cy, S*(0.5+comp*0.5), 'rgb(255,220,240)', a*comp*0.4);
    /* 裂纹：每一声 you have left */
    const cracks = t < 8.73 ? 0 : t < 9.61 ? 1 : t < 10.69 ? 2 : t < 11.43 ? 3 : t < 12.29 ? 4 : 5;
    ctx.strokeStyle = rgb('rgb(190,220,255)', a*0.55); ctx.lineWidth = 1.4;
    for(let i = 0; i < cracks; i++){
      const an = i/cracks*TAU + t*0.1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(an)*S*0.10, cy + Math.sin(an)*S*0.10);
      ctx.lineTo(cx + Math.cos(an + 0.3)*S*0.95, cy + Math.sin(an + 0.3)*S*0.75);
      ctx.stroke();
    }
    /* 高频振动 */
    if(vib > 0.2){
      const gx = (hash(Math.floor(t*30))-0.5)*vib*7, gy = (hash(Math.floor(t*30)+9)-0.5)*vib*7;
      ctx.strokeStyle = rgb('rgb(255,180,220)', a*vib*0.20);
      ctx.strokeRect(gx, gy, W, H);
    }
  } else {
    /* 碎裂后 */
    const bt = t - breakT;
    const k = smooth(clamp(bt/2.4, 0, 1));
    const fade = 1 - smooth(clamp((bt-2.8)/3.4, 0, 1));
    for(let i = 0; i < SHARDS.length; i++){
      const sh = SHARDS[i];
      const ang = Math.atan2(sh.cy, sh.cx) + sh.va*bt*0.4;
      const dist = bt*sh.vr*(0.5 + k*1.4);
      const x = cx + (sh.cx + Math.cos(ang)*dist)*S*(1 + bt*0.04);
      const y = cy + (sh.cy + Math.sin(ang)*dist)*S*(1 + bt*0.04);
      const mix = clamp(bt/4, 0, 1);
      const col = mix < 0.5 ? 'rgb(255,80,160)' : 'rgb(80,130,255)';
      ctx.save();
      ctx.globalAlpha = a*fade*(0.75 + 0.25*Math.sin(i));
      ctx.translate(x, y); ctx.rotate(sh.rot + sh.va*bt);
      const s = S*0.055*sh.size;
      ctx.beginPath();
      ctx.moveTo((sh.pts[0].x-sh.cx)*s, (sh.pts[0].y-sh.cy)*s);
      ctx.lineTo((sh.pts[1].x-sh.cx)*s, (sh.pts[1].y-sh.cy)*s);
      ctx.lineTo((sh.pts[2].x-sh.cx)*s, (sh.pts[2].y-sh.cy)*s);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      ctx.restore();
    }
    /* 孤立余烬 */
    drawGlow(cx, cy, S*(0.08 + 0.04*Math.sin(t*2)), 'rgb(150,190,255)', a*(0.5-fade*0.2));
    ctx.fillStyle = rgb('rgb(230,240,255)', a*0.8);
    ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, TAU); ctx.fill();
    if(t > 16){
      drawTextSprite(textSprite('(´;ω;`)', softFont(16), 'rgb(170,190,230)', null), cx, H*0.74, 18, a*0.5, 0);
    }
  }
  ctx.restore();
}

function renderRebuild(t, a){
  ctx.save();
  bg('#050417', a);
  const cx = W/2, cy = H/2, S = Math.min(W,H)*0.40;
  const gather = easeOut(clamp((t-0.2)/8.0, 0, 1));
  const bt = Math.max(beatPulse, Math.pow(Math.max(0, Math.sin(t*12.8 - 1.4)), 18));
  /* 汇聚粒子 */
  for(let i = 0; i < 130; i++){
    const th = i/130*TAU;
    const target = HEART_PTS[Math.floor(i*140/130) % 140];
    const startR = Math.min(W,H)*(0.52 + hash(i*3.3)*0.30);
    const sx = cx + Math.cos(th + hash(i)*0.6)*startR;
    const sy = cy + Math.sin(th*1.7 + hash(i+30)*0.8)*startR*0.6;
    const x = lerp(sx, cx + target.x*S*(1 + bt*0.03), gather);
    const y = lerp(sy, cy + target.y*S*(1 + bt*0.03), gather);
    const col = mix3('rgb(110,210,255)', 'rgb(255,110,210)', gather);
    ctx.fillStyle = rgb(col, a*(0.25 + 0.45*gather));
    ctx.beginPath(); ctx.arc(x, y, 1.2 + gather*1.8 + bt*1.6, 0, TAU); ctx.fill();
    if(i % 17 === 0) drawGlow(x, y, 7 + gather*9, col, a*(0.18 + gather*0.2));
  }
  /* 心形轮廓逐渐出现 */
  if(gather > 0.45){
    ctx.strokeStyle = rgb(mix3('rgb(110,210,255)','rgb(255,110,210)',gather), a*(gather-0.45)*1.4);
    ctx.lineWidth = 2.4;
    pathHeartShape(S*(1 + bt*0.04), 0, cx, cy); ctx.stroke();
  }
  drawGlow(cx, cy, S*(0.14 + gather*0.16), 'rgb(255,130,220)', a*(0.25 + gather*0.3));
  /* 轨道环 */
  for(let k = 0; k < 2; k++){
    const rr = S*(0.62 + k*0.18) * (1 + bt*0.03);
    ctx.strokeStyle = rgb(k ? 'rgb(255,110,210)' : 'rgb(110,210,255)', a*(0.15 + gather*0.15));
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, rr, t*(0.3 + k*0.4), t*(0.3 + k*0.4)+TAU*0.72); ctx.stroke();
  }
  ctx.restore();
}
function mix3(c1, c2, k){
  const a = String(c1).match(/\d+/g), b = String(c2).match(/\d+/g);
  return 'rgb(' + Math.round(lerp(+a[0], +b[0], k)) + ',' + Math.round(lerp(+a[1], +b[1], k)) + ',' + Math.round(lerp(+a[2], +b[2], k)) + ')';
}

    {x:0.16, y:0.66, tx:'lim (me → you) = ∞'},
    {x:0.84, y:0.42, tx:'(x²+y²−1)³ = x²y³'},
    {x:0.84, y:0.66, tx:'if(you == free) me.trapped();'}
  ];
  for(let i = 0; i < formulas.length; i++){
    const f = formulas[i];
    const fs = Math.min(15, W*0.016);
    drawTextSprite(textSprite(f.tx, fitFont(fs), rgb('rgb(190,210,255)', 0.75), null), W*f.x, H*f.y, fs, a*(0.5 + 0.3*Math.sin(t*1.3+i)), 0);
  }
  /* 被困住的点 / 自由的点 */
  const tt = t*0.8;
  const den = 1 + Math.sin(tt)*Math.sin(tt);
  const px = cx + Math.cos(tt)/den*S, py = cy + Math.sin(tt)*Math.cos(tt)/den*S;
  drawGlow(px, py, 10, 'rgb(255,140,220)', a*0.8);
  if(t > 8){
    const freeX = W*0.5 + Math.sin(t*0.7)*W*0.2, freeY = H*0.78 + Math.cos(t*0.5)*30;
    drawGlow(freeX, freeY, 8, 'rgb(140,220,255)', a*0.5);
    ctx.fillStyle = rgb('rgb(255,255,255)', a*0.6); ctx.font = fitFont(11);
    ctx.textAlign = 'center'; ctx.fillText('free', freeX, freeY+16);
    ctx.fillText('trapped', px, py+18); ctx.textAlign = 'left';
  }
  drawTextSprite(textSprite('(⁄ ⁄•⁄ω⁄•⁄ ⁄)', softFont(16), 'rgb(255,200,230)', null), W*0.82, H*0.80, 18, a*0.65, Math.sin(t)*0.1);
  ctx.restore();
}

/* =========================================================
   SCENE 12 · 03:11.36 - 03:25.81  星轨 / 被困在爱里
========================================================= */
function renderOrbit(t, a){
  ctx.save();
  bg('#020310', a);
  const cx = W/2, cy = H/2, S = Math.min(W,H)*0.37;
  drawGlow(cx, cy, S*0.9, 'rgb(80,90,190)', a*0.20);
  drawGlow(cx, cy, S*0.45, 'rgb(255,110,190)', a*0.14);
  /* 星野 */
  for(let i = 0; i < STARS.length; i++){
    const st = STARS[i];
    const x = st.x*W + Math.sin(t*0.2 + i)*2;
    const y = st.y*H + Math.cos(t*0.17 + i)*2;
    const tw = 0.25 + 0.75*Math.abs(Math.sin(t*st.sp*2 + st.tw));
    ctx.fillStyle = rgb('rgb(220,230,255)', a*tw*0.5);
    ctx.fillRect(x, y, st.z*2.2, st.z*2.2);
  }
  /* 流星 */
  for(let i = 0; i < 3; i++){
    const k = fract(t*0.09 + i*0.37);
    if(k > 0.04 && k < 0.28){
      const sx = W*(0.2 + i*0.3) + k*W*1.3, sy = H*(0.08 + i*0.1) + k*W*0.35;
      ctx.strokeStyle = rgb('rgb(180,220,255)', a*(1-(k-0.04)/0.24)*0.6);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx-40, sy-14); ctx.stroke();
    }
  }
  /* 心形轨道 */
  ctx.strokeStyle = rgb('rgb(150,150,255)', a*0.18); ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i = 0; i < HEART_PTS.length; i++){
    const p = HEART_PTS[i];
    const x = cx+p.x*S, y = cy+p.y*S;
    if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  /* 两个被困住的星体 */
  const N = HEART_PTS.length;
  const speed = 0.13 + beatPulse*0.04;
  const i1 = Math.floor((t*speed)%1*N) % N;
  const i2 = (i1 + Math.floor(N/2)) % N;
  const bodies = [i1, i2];
  for(let b = 0; b < bodies.length; b++){
    const idx = bodies[b];
    const p = HEART_PTS[idx];
    const x = cx + p.x*S, y = cy + p.y*S;
    const col = b === 0 ? 'rgb(255,120,210)' : 'rgb(110,220,255)';
    /* 拖尾 */
    for(let q = 1; q <= 8; q++){
      const p2 = HEART_PTS[(idx - q*3 + N) % N];
      ctx.fillStyle = rgb(col, a*q*0.025);
      ctx.beginPath(); ctx.arc(cx+p2.x*S, cy+p2.y*S, 2.2 - q*0.16, 0, TAU); ctx.fill();
    }
    drawGlow(x, y, 13, col, a*0.7);
  }
  drawGlow(cx, cy, S*0.08, 'rgb(255,240,250)', a*0.8);
  /* 猫猫宇航员 + 奶茶 */
  drawTextSprite(textSprite('(=^･ω･^=)', softFont(15), 'rgb(255,210,230)', null), W*0.14 + Math.sin(t*0.4)*10, H*0.22 + Math.cos(t*0.5)*8, 17, a*0.7, 0);
  const tea = emojiSprite('🧋', 24);
  ctx.save(); ctx.globalAlpha = a*0.55; ctx.translate(W*0.86 + Math.cos(t*0.3)*10, H*0.18 + Math.sin(t*0.4)*8);
  ctx.rotate(Math.sin(t*0.6)*0.2); ctx.drawImage(tea, -12, -12, 24, 24); ctx.restore();
  ctx.restore();
}

/* =========================================================
   SCENE 13 · 03:25.81 - 结束  关机
========================================================= */
function renderShutdown(t, a){
  ctx.save();
  bg('#000000', a);
  const cx = W/2, cy = H/2;
  const collapse = smooth(clamp((t-2.6)/0.5, 0, 1));
  if(collapse < 1){
    const sy = 1 - collapse;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, Math.max(0.008, sy));
    ctx.translate(-cx, -cy);
    ctx.font = fitFont(Math.min(22, W*0.026));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if(t < 0.7){
      ctx.fillStyle = rgb('rgb(255,90,150)', a*0.95);
      ctx.fillText('> EXECUTION', cx, cy-8);
    } else if(t < 1.6){
      ctx.fillStyle = rgb('rgb(130,240,190)', a*0.8);
      ctx.fillText('> process exited with code 0', cx, cy-8);
    } else if(t < 2.6){
      ctx.fillStyle = rgb('rgb(120,180,255)', a*0.75);
      ctx.fillText('> shutdown -h now', cx, cy-8);
    } else {
      ctx.fillStyle = rgb('rgb(255,255,255)', a*0.6);
      ctx.fillText('█', cx, cy-8);
    }
    ctx.restore();
    if(collapse > 0.1){
      ctx.fillStyle = rgb('rgb(255,255,255)', a*(1-collapse)*0.9);
      ctx.fillRect(0, cy-1, W, 2);
    }
  } else {
    ctx.fillStyle = rgb('rgb(140,160,200)', a*0.30); ctx.font = fitFont(12);
    ctx.textAlign = 'center';
    ctx.fillText('world.execute(me); // return 0;', cx, cy-10);
    ctx.fillStyle = rgb('rgb(255,170,210)', a*0.38); ctx.font = softFont(15);
    ctx.fillText('(˘ω˘) zzZ', cx, cy+14);
    ctx.textAlign = 'left';
    const tw = 0.3 + 0.3*Math.sin(t*2.1);
    drawGlow(cx, H*0.82, 5 + tw*6, 'rgb(110,200,255)', a*0.25);
  }
  ctx.restore();
}

/* ============ 覆盖 bg：让全局 alpha 正确参与场景淡入淡出 ============ */
bg = function(color, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
};

let scanPattern = null, noisePattern = null;
scanPattern = ctx.createPattern(scanCanvas, 'repeat');
noisePattern = ctx.createPattern(noiseCanvas, 'repeat');

/* ============ 场景时间轴 ============ */
const SCENES = [
  {start:0.00,   end:15.90,  render:renderBoot,      fx:'glitch'},
  {start:15.90,  end:29.70,  render:renderCompile,   fx:'fade'},
  {start:29.70,  end:44.45,  render:renderGeometry,  fx:'flash'},
  {start:44.45,  end:59.22,  render:renderElectric,  fx:'iris'},
  {start:59.22,  end:74.04,  render:renderNeural,    fx:'heart'},
  {start:74.04,  end:88.59,  render:renderCute,      fx:'wipe'},
  {start:88.59,  end:103.49, render:renderDual,      fx:'fade'},
  {start:103.49, end:125.70, render:renderShatter,   fx:'glitch'},
  {start:125.70, end:147.65, render:renderError,     fx:'flash'},
  {start:147.65, end:162.62, render:renderExecution, fx:'fade'},
  {start:162.62, end:177.24, render:renderRebuild,   fx:'wipe'},
  {start:177.24, end:191.36, render:renderEquations, fx:'fade'},
  {start:191.36, end:205.81, render:renderOrbit,     fx:'fade'},
  {start:205.81, end:99999,  render:renderShutdown,  fx:null}
];
const OVERLAP = 1.25, HALF = OVERLAP / 2;

function sceneIndexAt(t){
  for(let i = SCENES.length - 1; i >= 0; i--){
    if(t >= SCENES[i].start - 0.001) return i;
  }
  return 0;
}
function findTransition(t){
  for(let i = 0; i < SCENES.length - 1; i++){
    const b = SCENES[i+1].start;
    if(t >= b - HALF && t <= b + HALF){
      return {i: i, k: clamp((t - (b - HALF)) / OVERLAP, 0, 1)};
    }
  }
  return null;
}

function syntheticGlitch(k, t){
  const pk = Math.sin(Math.PI * k);
  if(pk <= 0.03) return;
  ctx.save();
  const seed = Math.floor(t * 18);
  for(let n = 0; n < 9; n++){
    const y = hash(n*13.7 + seed) * H;
    const h = 2 + hash(n*7.1 + seed) * 13;
    ctx.fillStyle = (n % 2) ? 'rgba(255,0,125,' + (pk*0.18) + ')' : 'rgba(0,235,255,' + (pk*0.18) + ')';
    ctx.fillRect(0, y, W, h);
  }
  const off = pk * 20;
  for(let n = 0; n < 5; n++){
    const y = hash(n*3.3 + seed) * H;
    ctx.fillStyle = 'rgba(0,0,0,' + (pk*0.38) + ')';
    ctx.fillRect((n % 2 ? off : -off), y, W*0.32, 2 + hash(n*5.9 + seed)*10);
  }
  ctx.restore();
}

function applyTransition(i, j, k, t){
  const prev = SCENES[i], next = SCENES[j];
  const fx = prev.fx || 'fade';
  const pt = clamp(t - prev.start, 0, Math.max(0.001, prev.end - prev.start));
  const nt = clamp(t - next.start, 0, Math.max(0.001, next.end - next.start));
  if(fx === 'fade' || fx === 'flash' || fx === 'glitch'){
    prev.render(pt, 1 - k);
    next.render(nt, k);
  } else {
    prev.render(pt, 1);
    ctx.save();
    if(fx === 'iris'){
      const rr = Math.max(6, Math.hypot(W, H) * 0.66 * smooth(k));
      ctx.beginPath(); ctx.arc(W/2, H/2, rr, 0, TAU); ctx.clip();
    } else if(fx === 'heart'){
      const hs = Math.min(W, H) * (0.04 + 0.92 * smooth(k));
      pathHeartShape(hs, 0, W/2, H/2); ctx.clip();
    } else if(fx === 'wipe'){
      ctx.beginPath(); ctx.rect(0, 0, W * smooth(k), H); ctx.clip();
    }
    next.render(nt, 1);
    ctx.restore();
  }
  /* 场景切换强调层 */
  if(fx === 'flash'){
    const fa = Math.sin(Math.PI * k);
    if(fa > 0.02){
      ctx.fillStyle = 'rgba(255,255,255,' + (fa*0.78).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  } else if(fx === 'glitch'){
    syntheticGlitch(k, t);
  } else if(fx === 'iris' || fx === 'heart' || fx === 'wipe'){
    const ep = Math.sin(Math.PI * k);
    ctx.save();
    ctx.globalAlpha = ep * 0.8;
    ctx.strokeStyle = '#dffcff'; ctx.lineWidth = 2;
    if(fx === 'iris'){
      const rr = Math.max(6, Math.hypot(W, H) * 0.66 * smooth(k));
      ctx.beginPath(); ctx.arc(W/2, H/2, rr, 0, TAU); ctx.stroke();
    } else if(fx === 'heart'){
      const hs = Math.min(W, H) * (0.04 + 0.92 * smooth(k));
      pathHeartShape(hs, 0, W/2, H/2); ctx.stroke();
    } else {
      const x = W * smooth(k);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.restore();
  }
}

function render(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  const tr = findTransition(t);
  if(tr){
    applyTransition(tr.i, tr.i+1, tr.k, t);
  } else {
    const si = sceneIndexAt(t);
    const sc = SCENES[si];
    const lt = clamp(t - sc.start, 0, Math.max(0.001, sc.end - sc.start));
    sc.render(lt, 1);
  }
}

function drawGlobalFx(t){
  if(scanPattern){
    ctx.save(); ctx.globalAlpha = 0.13; ctx.fillStyle = scanPattern; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if(noisePattern){
    const nx = (Math.random() * 256) | 0, ny = (Math.random() * 256) | 0;
    ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = noisePattern;
    ctx.translate(-nx, -ny); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
  }
  if(vignetteCanvas){
    ctx.save(); ctx.globalAlpha = 0.72; ctx.drawImage(vignetteCanvas, 0, 0, W, H); ctx.restore();
  }
}

/* ============ 歌词渲染 ============ */
const lyricSpriteCache = new Map();
function makeLyricSprite(line){
  let c = lyricSpriteCache.get(line);
  if(c) return c;
  const font = softFont(30);
  c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = font;
  const parts = String(line).split(/(\b[A-Z]{2,}\b)/g);
  let total = 0;
  for(const p of parts) if(p) total += g.measureText(p).width;
  c.width = Math.ceil(total) + 48;
  c.height = 64;
  g.font = font; g.textAlign = 'left'; g.textBaseline = 'middle';
  let x = 24;
  for(const p of parts){
    if(!p) continue;
    const upper = /^[A-Z]{2,}$/.test(p);
    g.fillStyle = upper ? 'rgb(255,105,210)' : 'rgb(245,248,255)';
    g.shadowColor = upper ? 'rgba(255,80,190,0.65)' : 'rgba(0,0,0,0.75)';
    g.shadowBlur = 8;
    g.fillText(p, x, c.height/2);
    x += g.measureText(p).width;
  }
  lyricSpriteCache.set(line, c);
  return c;
}
let lastLyricIndex = -1;
function drawLyrics(t){
  const li = lyricIndexAt(t);
  if(li < 0) return;
  const spr = makeLyricSprite(LYRICS[li].text);
  let h = 40;
  let dw = spr.width * (h / spr.height);
  const maxW = W * 0.88;
  if(dw > maxW){ h *= maxW / dw; dw = maxW; }
  const pop = 1 + linePulse * 0.05;
  const y = H - 62;
  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = '#000000';
  pathRoundRect(W/2 - dw*pop/2 - 16, y - h*pop/2 - 6, dw*pop + 32, h*pop + 12, 14);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.97;
  ctx.translate(W/2, y);
  const sc = h * pop / spr.height;
  ctx.drawImage(spr, -spr.width*sc/2, -h*pop/2, spr.width*sc, h*pop);
  ctx.restore();
}

function drawProgress(t){
  const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 211.96;
  const p = clamp(t / dur, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(0, 0, W, 2);
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, 'rgba(110,240,255,0.8)');
  grad.addColorStop(1, 'rgba(255,105,210,0.8)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W * p, 2);
}

/* ============ 节拍检测 ============ */
let energyFill = 0;
let fallbackBeatIndex = -1;
function fallbackBeat(t){
  const interval = 60 / 128;
  const idx = Math.floor(t / interval);
  if(idx !== fallbackBeatIndex && t > 0.25){
    fallbackBeatIndex = idx;
    beatPulse = 1;
  }
}
function updateBeat(dt, now, t){
  if(analyser && freqData && started){
    try{
      analyser.getByteFrequencyData(freqData);
      const n = Math.min(28, freqData.length);
      let sum = 0;
      for(let i = 1; i < n; i++) sum += freqData[i];
      const e = sum / ((n - 1) * 255);
      bassLevel += (e - bassLevel) * (1 - Math.exp(-dt * 9));
      if(energyFill < energyHist.length){
        energyHist[energyFill] = e; energyFill++;
      } else {
        energyHist[energyPos] = e; energyPos = (energyPos + 1) % energyHist.length;
        let avg = 0;
        for(let i = 0; i < energyHist.length; i++) avg += energyHist[i];
        avg /= energyHist.length;
        if(e > avg * 1.42 + 0.025 && e > 0.09 && now - lastBeatAt > 245){
          beatPulse = 1; lastBeatAt = now;
        }
      }
    }catch(err){ analyser = null; }
  } else if(started){
    fallbackBeat(t);
  }
  beatPulse = Math.max(0, beatPulse - dt * 3.4);
  linePulse = Math.max(0, linePulse - dt * 2.7);
}

/* ============ 音频与交互 ============ */
function initAudioGraph(){
  if(audioCtx || audioFailed) return;
  /* [split_audio.py 注入] 外链音频 + file:// 的跨源限制：
     浏览器会把 file:// 媒体当作跨源，createMediaElementSource() 不报错，
     但频谱恒为 0 且输出静音。此时放弃 Web Audio，让 <audio> 走原生播放，
     节拍检测自动回退到 fallbackBeat()。用 http 打开则不受影响。 */
  if(AUDIO_SRC.indexOf('data:') !== 0 && location.protocol === 'file:'){
    analyser = null;
    return;
  }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }catch(err){
    analyser = null;
  }
}
function showError(msg){
  audioFailed = true;
  errMsg.textContent = msg || '音频加载失败，请重新打开文件。';
  errorEl.classList.remove('hidden');
}
function startMV(){
  if(started || audioFailed) return;
  started = true;
  startEl.classList.add('hidden');
  initAudioGraph();
  const pr = audio.play();
  if(pr && pr.then) pr.catch(function(e){ showError('无法播放：' + e.name + '。请点击后重试。'); });
}
function replay(){
  replayEl.classList.add('hidden');
  audioEnded = false;
  audio.currentTime = 0;
  audio.play().catch(function(){});
}
function togglePlay(){
  if(!started){ startMV(); return; }
  if(audioEnded){ replay(); return; }
  if(audio.paused){ audio.play().catch(function(){}); } else { audio.pause(); }
}
function fmtTime(s){
  if(!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const m = Math.floor(s / 60), ss = (s % 60);
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}
function updateUI(){
  const d = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 0;
  timeEl.textContent = fmtTime(audio.currentTime) + ' / ' + (d ? fmtTime(d) : '--:--');
  btnPlay.textContent = audio.paused ? '▶' : '⏸';
}
startEl.addEventListener('click', startMV);
replayEl.addEventListener('click', replay);
btnPlay.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){
    e.preventDefault();
    if(!started || audioEnded) replay(); else togglePlay();
  } else if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  } else if(e.key === 'm' || e.key === 'M'){
    audio.muted = !audio.muted;
  }
});
canvas.addEventListener('dblclick', function(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
});
audio.addEventListener('play', updateUI);
audio.addEventListener('pause', updateUI);
audio.addEventListener('loadedmetadata', updateUI);
audio.addEventListener('durationchange', updateUI);
audio.addEventListener('ended', function(){
  audioEnded = true;
  replayEl.classList.remove('hidden');
  updateUI();
});
audio.addEventListener('error', function(){
  showError('音频解码失败：' + (audio.error ? audio.error.code : 'unknown') + '。请使用 Chrome / Edge 打开。');
});

/* ============ 主循环 ============ */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  let t = audio.currentTime || 0;
  if(!isFinite(t)) t = 0;
  updateBeat(dt, now, t);
  const li = lyricIndexAt(t);
  if(li !== lastLyricIndex){
    lastLyricIndex = li;
    if(li >= 0) linePulse = 1;
  }
  render(t);
  drawGlobalFx(t);
  drawLyrics(t);
  drawProgress(t);
  if(now - lastUIUpdate > 220){ updateUI(); lastUIUpdate = now; }
}
let lastUIUpdate = 0;
requestAnimationFrame(frame);
</script>
</body>
